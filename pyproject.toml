[build-system]
requires = ["setuptools>=75.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "JobFunnel"
dynamic = ["version"]
description = "Automated tool for scraping job postings."
readme = "readme.md"
requires-python = ">=3.13"
license = {text = "MIT License"}
authors = [
    { name = "Paul McInnis", email = "paulmcinnis99@gmail.com" },
    { name = "Bradley Kohler" },
    { name = "Jose Alarcon" },
    { name = "Erich Mengore" },
    { name = "Mark van der Broek" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.9.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5.0",
    "nltk>=3.9.0",
    "scipy>=1.14.0",
    "playwright>=1.48.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
]

[project.urls]
Homepage = "https://github.com/PaulMcInnis/JobFunnel"
Documentation = "https://github.com/PaulMcInnis/JobFunnel/docs"
Repository = "https://github.com/PaulMcInnis/JobFunnel"
Issues = "https://github.com/PaulMcInnis/JobFunnel/issues"

[project.scripts]
funnel = "jobfunnel.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "jobfunnel.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests", "docs", "images"]

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
addopts = "--cov=jobfunnel"

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["jobfunnel"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = false
